<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Black Home — Voice</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000000; overflow: hidden;
    font-family: -apple-system, 'Segoe UI', sans-serif;
  }
  body { min-height: 100dvh; position: relative; }

  /* ============ হোম স্ক্রিন ============ */
  .orb-wrapper {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    pointer-events: none; z-index: 1; opacity: 0;
    transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .orb-wrapper.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .aurora-wave {
    display: flex; align-items: center; justify-content: center;
    gap: 7px; height: 120px;
    filter: drop-shadow(0 0 12px rgba(255, 80, 180, 0.7));
  }
  .aurora-wave .w {
    width: 8px; border-radius: 99px;
    background: linear-gradient(to top, #ff0080, #ff80c0, #ffffff, #80d0ff, #0066ff);
    background-size: 100% 300%;
    animation: aurora-wave 1.4s ease-in-out infinite, aurora-color 3s linear infinite;
  }
  .aurora-wave .w:nth-child(1) { animation-delay: 0s; height: 30px; }
  .aurora-wave .w:nth-child(2) { animation-delay: 0.1s; height: 60px; }
  .aurora-wave .w:nth-child(3) { animation-delay: 0.2s; height: 90px; }
  .aurora-wave .w:nth-child(4) { animation-delay: 0.3s; height: 68px; }
  .aurora-wave .w:nth-child(5) { animation-delay: 0.4s; height: 105px; }
  .aurora-wave .w:nth-child(6) { animation-delay: 0.5s; height: 68px; }
  .aurora-wave .w:nth-child(7) { animation-delay: 0.6s; height: 90px; }
  .aurora-wave .w:nth-child(8) { animation-delay: 0.7s; height: 60px; }
  .aurora-wave .w:nth-child(9) { animation-delay: 0.8s; height: 30px; }
  @keyframes aurora-wave {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1.2); }
  }
  @keyframes aurora-color {
    0% { background-position: 0% 0%; }
    100% { background-position: 0% 300%; }
  }

  .voice-caption {
    position: absolute; top: calc(50% + 90px);
    left: 30px; right: 30px; z-index: 2;
    color: rgba(255, 200, 220, 0.9);
    font-size: 14px; line-height: 1.5;
    text-align: center; min-height: 20px; padding: 0 10px;
    opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
  }
  .voice-caption.on { opacity: 1; }

  .messages {
    position: absolute; top: 0; left: 0; right: 0; bottom: 184px;
    padding: 30px 20px; overflow-y: auto;
    display: flex; flex-direction: column;
    justify-content: flex-start; gap: 12px;
    z-index: 5; scrollbar-width: none;
  }
  .messages::-webkit-scrollbar { display: none; }
  .msg {
    color: #ffffff; font-size: 15px; line-height: 1.5;
    padding: 12px 18px;
    background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.05));
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 20px; align-self: flex-end; max-width: 80%;
    word-wrap: break-word; white-space: pre-wrap;
    animation: msg-in 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    backdrop-filter: blur(10px);
  }
  .msg.bot {
    align-self: flex-start;
    background: linear-gradient(135deg, rgba(255, 0, 128, 0.15), rgba(160, 32, 240, 0.1));
    border-color: rgba(255, 0, 128, 0.25); color: #ffcce0;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(-20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .input-row {
    position: absolute; bottom: 64px;
    left: 16px; right: 16px; display: flex; z-index: 10;
  }
  .input-wrap { position: relative; flex: 1; display: flex; }
  .input-box {
    flex: 1; min-height: 46px; max-height: 120px;
    background: #1a1a1a; border: 1px solid #2a2a2a;
    border-radius: 16px; padding: 12px 56px 12px 18px;
    color: #ffffff; font-size: 15px; line-height: 1.4;
    outline: none; resize: none; overflow-y: auto;
    font-family: inherit; scrollbar-width: none; width: 100%;
  }
  .input-box::-webkit-scrollbar { display: none; }
  .input-box::placeholder { color: #555; }
  .input-box:focus {
    border-color: #ff0080; background: #1f1a1f;
    box-shadow: 0 0 20px rgba(255, 0, 128, 0.25);
  }
  .send-btn {
    position: absolute; right: 6px; bottom: 6px;
    width: 38px; height: 38px; background: transparent;
    border: none; border-radius: 12px;
    display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .send-btn:active { transform: scale(0.88); }
  .send-btn svg {
    width: 22px; height: 22px; fill: url(#sendGrad);
    filter: drop-shadow(0 0 6px rgba(255, 0, 128, 0.8));
  }

  .bar {
    position: absolute; bottom: 6px;
    left: 16px; right: 16px; height: 50px;
    background: #1a1a1a; border: 1px solid #2a2a2a;
    border-radius: 16px; display: flex; align-items: center;
    justify-content: space-around; padding: 0 8px; z-index: 10;
  }
  .icon-btn {
    width: 40px; height: 40px; display: grid; place-items: center;
    border-radius: 10px; cursor: pointer; transition: all 0.2s ease;
  }
  .icon-btn:active { background: rgba(255, 0, 128, 0.15); transform: scale(0.9); }
  .icon-btn svg {
    width: 24px; height: 24px;
    stroke: #b0b0b0; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; fill: none;
  }
  .icon-btn:active svg, .icon-btn.active svg {
    stroke: #ff0080; filter: drop-shadow(0 0 8px rgba(255, 0, 128, 0.9));
  }
  .bolt-icon { fill: #b0b0b0; stroke: none; }
  .icon-btn:active .bolt-icon { fill: #ff0080; }

  /* ============ স্ক্যানার — ফুল স্ক্রিন ============ */
  .scanner {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100vw; height: 100vh;
    z-index: 9999;
    background: #000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .scanner.active { display: flex; }

  /* ক্যামেরা ভিডিও — পুরো স্ক্রিন জুড়ে */
  #cameraVideo {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    background: #000;
  }

  /* ক্যামেরা চালু না হলে কালো ব্যাকগ্রাউন্ড */
  .scanner-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    background:
      radial-gradient(circle at 50% 50%, rgba(255, 0, 128, 0.15), transparent 60%),
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
  }

  /* চারপাশের অন্ধকার মাস্ক (ক্যামেরা চালু হলে) */
  .camera-mask {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
    background: radial-gradient(
      circle at center,
      transparent 0%,
      transparent 28%,
      rgba(0, 0, 0, 0.55) 40%,
      rgba(0, 0, 0, 0.85) 60%
    );
  }
  .camera-mask.on { opacity: 1; }

  /* ক্লোজ বাটন */
  .scan-close {
    position: absolute;
    top: 30px; right: 24px;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.25);
    cursor: pointer;
    backdrop-filter: blur(10px);
    z-index: 20;
  }
  .scan-close:active { transform: scale(0.9); }
  .scan-close svg {
    width: 20px; height: 20px;
    stroke: #fff; stroke-width: 2.5;
    fill: none; stroke-linecap: round;
  }

  /* ভিউফাইন্ডার — মাঝখানে গোলাপি ফ্রেম */
  .viewfinder {
    position: relative;
    width: 260px; height: 260px;
    z-index: 5;
    pointer-events: none;
  }
  .viewfinder::before,
  .viewfinder::after,
  .viewfinder .corner-bl,
  .viewfinder .corner-br {
    content: '';
    position: absolute;
    width: 42px; height: 42px;
    border-color: #ff0080;
    border-style: solid;
    filter: drop-shadow(0 0 10px #ff0080);
  }
  .viewfinder::before {
    top: 0; left: 0;
    border-width: 4px 0 0 4px;
    border-top-left-radius: 14px;
  }
  .viewfinder::after {
    top: 0; right: 0;
    border-width: 4px 4px 0 0;
    border-top-right-radius: 14px;
  }
  .viewfinder .corner-bl {
    bottom: 0; left: 0;
    border-width: 0 0 4px 4px;
    border-bottom-left-radius: 14px;
  }
  .viewfinder .corner-br {
    bottom: 0; right: 0;
    border-width: 0 4px 4px 0;
    border-bottom-right-radius: 14px;
  }

  /* স্ক্যান লাইন */
  .scan-line {
    position: absolute;
    top: 0; left: 15px; right: 15px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ff0080, #a020f0, #ff0080, transparent);
    box-shadow: 0 0 15px #ff0080, 0 0 30px #ff0080;
    border-radius: 99px;
    animation: scan 2.2s ease-in-out infinite;
  }
  @keyframes scan {
    0% { top: 10px; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { top: calc(100% - 12px); opacity: 0; }
  }

  /* বড় ক্যামেরা ট্রিগার বাটন (স্ক্যানারে) */
  .camera-trigger {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    width: 76px; height: 76px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 3px solid rgba(255,255,255,0.3);
    display: grid; place-items: center;
    cursor: pointer;
    backdrop-filter: blur(10px);
    z-index: 20;
    box-shadow: 0 0 30px rgba(255, 0, 128, 0.3);
  }
  .camera-trigger:active {
    transform: translateX(-50%) scale(0.9);
    background: rgba(255, 0, 128, 0.3);
    border-color: #ff0080;
  }
  .camera-trigger svg {
    width: 34px; height: 34px;
    stroke: #ffffff; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
    fill: none;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
  }
  .camera-trigger.on { display: none; }

  /* ক্যামেরা এরর */
  .cam-error {
    position: absolute;
    bottom: 40px; left: 50%;
    transform: translateX(-50%);
    color: #ff5577;
    font-size: 13px;
    text-align: center;
    z-index: 20;
    display: none;
    padding: 10px 18px;
    background: rgba(255,0,85,0.15);
    border-radius: 20px;
    border: 1px solid rgba(255,0,85,0.3);
    backdrop-filter: blur(10px);
  }
</style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <linearGradient id="sendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff0080"/>
        <stop offset="100%" stop-color="#a020f0"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="messages" id="messages"></div>

  <div class="orb-wrapper" id="orbWrapper">
    <div class="aurora-wave">
      <div class="w"></div><div class="w"></div><div class="w"></div>
      <div class="w"></div><div class="w"></div><div class="w"></div>
      <div class="w"></div><div class="w"></div><div class="w"></div>
    </div>
  </div>

  <div class="voice-caption" id="voiceCaption"></div>

  <div class="input-row">
    <div class="input-wrap">
      <textarea class="input-box" id="inputBox" placeholder="কমান্ড লিখুন..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="bar">
    <div class="icon-btn" aria-label="Home">
      <svg viewBox="0 0 24 24">
        <path d="M3 11l9-8 9 8"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
    </div>
    <div class="icon-btn" id="cameraBtn" aria-label="Camera">
      <svg viewBox="0 0 24 24">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    </div>
    <div class="icon-btn" id="voiceBtn" aria-label="Voice">
      <svg viewBox="0 0 24 24">
        <rect x="9" y="3" width="6" height="12" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0"></path>
        <line x1="12" y1="18" x2="12" y2="22"></line>
        <line x1="8" y1="22" x2="16" y2="22"></line>
      </svg>
    </div>
    <div class="icon-btn" aria-label="Bolt">
      <svg viewBox="0 0 24 24">
        <path class="bolt-icon" d="M13 2L4.5 13.5h6L10 22l8.5-11.5h-6L13 2z"></path>
      </svg>
    </div>
    <div class="icon-btn" aria-label="Info">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <line x1="12" y1="11" x2="12" y2="16"></line>
        <circle cx="12" cy="8" r="0.5" fill="#b0b0b0" stroke="none"></circle>
      </svg>
    </div>
  </div>

  <!-- ============ ক্যামেরা স্ক্যানার — ফুল স্ক্রিন ============ -->
  <div class="scanner" id="scanner">
    <div class="scanner-bg"></div>
    <video id="cameraVideo" autoplay playsinline muted></video>
    <div class="camera-mask" id="cameraMask"></div>

    <div class="scan-close" id="closeScanner">
      <svg viewBox="0 0 24 24">
        <line x1="6" y1="6" x2="18" y2="18"></line>
        <line x1="18" y1="6" x2="6" y2="18"></line>
      </svg>
    </div>

    <div class="viewfinder">
      <div class="corner-bl"></div>
      <div class="corner-br"></div>
      <div class="scan-line"></div>
    </div>

    <div class="camera-trigger" id="cameraTrigger">
      <svg viewBox="0 0 24 24">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    </div>

    <div class="cam-error" id="camError">ক্যামেরা চালু করা যায়নি। অনুমতি দিন।</div>
  </div>

<script>
  var inputBox = document.getElementById('inputBox');
  var sendBtn = document.getElementById('sendBtn');
  var messages = document.getElementById('messages');
  var voiceBtn = document.getElementById('voiceBtn');
  var orbWrapper = document.getElementById('orbWrapper');
  var voiceCaption = document.getElementById('voiceCaption');

  /* ============ ক্যামেরা স্ক্যানার ============ */
  var cameraBtn = document.getElementById('cameraBtn');
  var scanner = document.getElementById('scanner');
  var closeScanner = document.getElementById('closeScanner');
  var cameraVideo = document.getElementById('cameraVideo');
  var cameraMask = document.getElementById('cameraMask');
  var cameraTrigger = document.getElementById('cameraTrigger');
  var camError = document.getElementById('camError');
  var cameraStream = null;

  /* ২ নাম্বার বাটন — স্ক্যানার খুলুন */
  cameraBtn.addEventListener('click', function() {
    scanner.classList.add('active');
  });

  /* ক্লোজ বাটন — স্ক্যানার বন্ধ */
  closeScanner.addEventListener('click', function() {
    scanner.classList.remove('active');
    stopCamera();
  });

  /* ক্যামেরা চালু */
  async function startCamera() {
    camError.style.display = 'none';
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });
      cameraVideo.srcObject = cameraStream;
      await cameraVideo.play();
      cameraMask.classList.add('on');
      cameraTrigger.classList.add('on');
    } catch (err) {
      console.error('Camera error:', err);
      camError.style.display = 'block';
    }
  }

  /* ক্যামেরা বন্ধ */
  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(function(t) { t.stop(); });
      cameraStream = null;
    }
    cameraVideo.srcObject = null;
    cameraMask.classList.remove('on');
    cameraTrigger.classList.remove('on');
  }

  /* ভিতরের বাটনে ট্যাপ — আসল ক্যামেরা চালু */
  cameraTrigger.addEventListener('click', startCamera);

  /* ============ ভয়েস ============ */
  var recognition = null;
  var isVoiceActive = false;
  var femaleVoice = null;

  function loadVoices() {
    var voices = speechSynthesis.getVoices();
    if (voices.length === 0) return;

    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang && voices[i].lang.indexOf('bn') === 0) {
        femaleVoice = voices[i]; break;
      }
    }
    if (!femaleVoice) {
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang && voices[i].lang.indexOf('hi') === 0) {
          femaleVoice = voices[i]; break;
        }
      }
    }
    if (!femaleVoice) {
      for (var i = 0; i < voices.length; i++) {
        if (/female|aria|jenny|samantha|zira|heera|swara/i.test(voices[i].name)) {
          femaleVoice = voices[i]; break;
        }
      }
    }
    if (!femaleVoice && voices.length > 0) femaleVoice = voices[0];
  }

  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
  setTimeout(loadVoices, 100);
  setTimeout(loadVoices, 500);
  setTimeout(loadVoices, 1500);
  setTimeout(loadVoices, 3000);

  function speakNow(text, onEnd) {
    try { speechSynthesis.cancel(); } catch (e) {}

    var warmup = new SpeechSynthesisUtterance(' ');
    warmup.volume = 0;
    warmup.rate = 10;
    try { speechSynthesis.speak(warmup); } catch (e) {}

    var u = new SpeechSynthesisUtterance(text);
    if (!femaleVoice) loadVoices();
    if (femaleVoice) {
      u.voice = femaleVoice;
      u.lang = femaleVoice.lang;
    } else {
      u.lang = 'bn-IN';
    }
    u.pitch = 1.1;
    u.rate = 0.95;
    u.volume = 1;

    voiceCaption.classList.add('on');
    voiceCaption.textContent = text;

    u.onend = function() { if (onEnd) onEnd(); };
    u.onerror = function() { if (onEnd) onEnd(); };

    try { speechSynthesis.speak(u); } catch (e) {}
  }

  function stopVoice() {
    isVoiceActive = false;
    if (recognition) { try { recognition.stop(); } catch (e) {} }
    speechSynthesis.cancel();
    voiceCaption.classList.remove('on');
    voiceCaption.textContent = '';
    orbWrapper.classList.remove('active');
    voiceBtn.classList.remove('active');
  }

  function startListening() {
    if (!isVoiceActive) return;

    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      voiceCaption.textContent = 'এই ব্রাউজারে ভয়েস সাপোর্ট নেই';
      return;
    }

    recognition = new SR();
    recognition.lang = 'bn-BD';
    recognition.continuous = false;
    recognition.interimResults = true;

    var finalText = '';

    recognition.onstart = function() {
      voiceCaption.classList.add('on');
      voiceCaption.textContent = 'শুনছি...';
    };

    recognition.onresult = function(e) {
      var interim = '';
      finalText = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t;
        else interim += t;
      }
      voiceCaption.textContent = finalText || interim || 'শুনছি...';
    };

    recognition.onend = function() {
      if (!isVoiceActive) return;
      if (finalText.trim()) respondToUser(finalText.trim());
      else if (isVoiceActive) setTimeout(startListening, 500);
    };

    try { recognition.start(); } catch (e) {}
  }

  function respondToUser(text) {
    var lower = text.toLowerCase();
    var reply = '';

    if (/হ্যালো|হাই|hello|hi|নমস্কার/.test(lower)) reply = 'হ্যালো! আমি মাইরা। কেমন আছেন?';
    else if (/কেমন আছ|how are/.test(lower)) reply = 'আমি ভালো আছি! আপনি কেমন আছেন?';
    else if (/নাম|name|তুমি কে/.test(lower)) reply = 'আমার নাম মাইরা।';
    else if (/সময়|time/.test(lower)) {
      var n = new Date();
      reply = 'এখন ' + n.getHours() + 'টা ' + n.getMinutes() + ' মিনিট।';
    }
    else if (/ধন্যবাদ|thank/.test(lower)) reply = 'আপনাকে স্বাগতম!';
    else if (/বাই|bye|বিদায়/.test(lower)) {
      reply = 'বিদায়! আবার কথা হবে।';
      speakNow(reply);
      setTimeout(stopVoice, 3000);
      return;
    }
    else reply = 'আপনি বললেন: ' + text + '।';

    speakNow(reply, function() {
      if (isVoiceActive) setTimeout(startListening, 500);
    });
  }

  voiceBtn.addEventListener('click', function() {
    if (isVoiceActive) { stopVoice(); return; }

    isVoiceActive = true;
    orbWrapper.classList.add('active');
    voiceBtn.classList.add('active');
    voiceCaption.classList.add('on');
    voiceCaption.textContent = '';

    loadVoices();
    speakNow('হ্যালো! আমি মাইরা। বলুন কী করতে চান।', function() {
      if (isVoiceActive) setTimeout(startListening, 500);
    });
  });

  /* ============ মেসেজ ============ */
  function autoResize() {
    inputBox.style.height = 'auto';
    inputBox.style.height = Math.min(inputBox.scrollHeight, 120) + 'px';
  }
  inputBox.addEventListener('input', autoResize);

  function addMessage(text, type) {
    var b = document.createElement('div');
    b.className = 'msg' + (type === 'bot' ? ' bot' : '');
    b.textContent = text;
    messages.appendChild(b);
    messages.scrollTop = messages.scrollHeight;
  }

  function sendMessage() {
    var t = inputBox.value.trim();
    if (!t) return;
    addMessage(t, 'user');
    inputBox.value = '';
    inputBox.style.height = 'auto';
    inputBox.focus();
    var reply = 'আপনি বললেন: ' + t;
    addMessage('🤖 ' + reply, 'bot');
    speakNow(reply);
  }

  sendBtn.addEventListener('click', sendMessage);
  inputBox.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      scanner.classList.remove('active');
      stopCamera();
    }
  });
</script>

</body>
</html>
